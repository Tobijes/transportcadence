services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
    - "8000:80"
    volumes:
      - ./dataset:/app/dataset
    restart: always
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/api/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
